<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Devas y Freya - Mundo 1: El Bosque</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { margin: 0; padding: 0; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
#game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
canvas { background: linear-gradient(to bottom, #1e293b, #0f172a); display: block; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
.ui-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 20px; text-align: center; }
.hidden { display: none !important; }
h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 10px; }
p { color: #94a3b8; font-size: 1rem; max-width: 450px; margin-bottom: 20px; }
.btn { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 8px; }
.btn-green { background: #16a34a; }
.btn-purple { background: #9333ea; }
#mobile-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 140px; display: none; justify-content: space-between; padding: 10px 20px; pointer-events: none; z-index: 5; }
.control-group { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
.touch-btn { width: 60px; height: 60px; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 50%; color: white; font-size: 1.2rem; font-weight: bold; display: flex; justify-content: center; align-items: center; }
#hud { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; font-weight: bold; font-size: 0.9rem; }
.hud-panel { background: rgba(15, 23, 42, 0.8); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body>
<div id="game-container">
<div id="hud" class="hidden">
<div class="hud-panel" id="hud-room">Mundo 1: El Bosque</div>
<div class="hud-panel" id="hud-rope">Cuerda: 120px Máx</div>
</div>
<div id="screen-menu" class="ui-screen">
<h1>Devas & Freya</h1>
<p>Versión 0.3.0 - Prueba de Físicas y Mundo 1</p>
<button class="btn btn-green" onclick="startGame()">Crear Sala Privada / Jugar</button>
</div>
<canvas id="gameCanvas" width="800" height="450"></canvas>
<div id="mobile-controls">
<div class="control-group">
<div class="touch-btn" ontouchstart="setTouch('left', true)" ontouchend="setTouch('left', false)">◄</div>
<div class="touch-btn" ontouchstart="setTouch('right', true)" ontouchend="setTouch('right', false)">►</div>
</div>
<div class="control-group">
<div class="touch-btn" style="background: rgba(220, 38, 38, 0.4);" ontouchstart="setTouch('anchor', true)" ontouchend="setTouch('anchor', false)">📌</div>
<div class="touch-btn" style="background: rgba(37, 99, 235, 0.4);" ontouchstart="setTouch('jump', true)" ontouchend="setTouch('jump', false)">⬆</div>
</div>
</div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let gameState = 'MENU';
if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
document.getElementById('mobile-controls').style.display = 'flex';
}
const MAX_ROPE_LENGTH = 120;
let player1 = {x: 100, y: 300, vx: 0, vy: 0, width: 30, height: 40, color: '#38bdf8', name: 'Devas', grounded: false};
let player2 = {x: 160, y: 300, vx: 0, vy: 0, width: 30, height: 40, color: '#ec4899', name: 'Freya', grounded: false};

// Plataformas del Mundo 1 (Distancias verticales <= 90)
const platforms = [
{x: 50, y: 380, w: 200, h: 20},
{x: 280, y: 310, w: 140, h: 20},
{x: 450, y: 230, w: 140, h: 20},
{x: 620, y: 160, w: 180, h: 20}
 ];
const touchInput = {left: false, right: false, jump: false, anchor: false};
function setTouch(a, s) { touchInput[a] = s; }

function startGame() {
document.getElementById('screen-menu').classList.add('hidden');
document.getElementById('hud').classList.remove('hidden');
gameState = 'PLAYING';
}

function update() {
if (gameState !== 'PLAYING') return;

// Movimiento Devas
player1.vy += 0.4; player1.vx *= 0.85;
if (touchInput.left) player1.vx = -3.5;
if (touchInput.right) player1.vx = 3.5;
if (touchInput.jump && player1.grounded) { player1.vy = -9; player1.grounded = false; }
player1.x += player1.vx; player1.y += player1.vy;

//
